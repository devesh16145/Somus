<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <title>{{title}}</title>
  <style>
    :root {
      --bg: #f6f5f0;
      --ink: #1c1c20;
      --ink-dim: #5a5852;
      --accent: #b3781a;
      --rule: #d8d6cd;
      --pre-bg: #ececea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0c;
        --ink: #e8e6df;
        --ink-dim: #95938b;
        --accent: #FFCD5B;
        --rule: #2a2a30;
        --pre-bg: #15151a;
      }
    }
    html { background: var(--bg); }
    body {
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
    h1 { font-size: 2rem; margin: 0 0 1rem; }
    h2 { font-size: 1.3rem; margin: 2.75rem 0 1rem; }
    h3 { font-size: 1.05rem; margin: 2rem 0 0.75rem; }
    p, li { color: var(--ink); }
    em { color: var(--ink-dim); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul, ol { padding-left: 1.4rem; }
    li { margin: 0.25rem 0; }
    code { font: 0.9em ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--pre-bg); padding: 0.1em 0.35em; border-radius: 4px; }
    pre { background: var(--pre-bg); padding: 1rem; border-radius: 8px; overflow-x: auto; }
    pre code { background: transparent; padding: 0; }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
    blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; margin: 1rem 0; color: var(--ink-dim); }
    footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); color: var(--ink-dim); font-size: 0.9rem; }
    footer a { color: var(--ink-dim); }
  </style>
</head>
<body>
{{content}}
<footer>
  <p><a href="/">Home</a> · <a href="https://github.com/devesh16145/Somus">Source</a> · <a href="mailto:devesh.iiitd@gmail.com">Contact</a></p>
</footer>
</body>
</html>
